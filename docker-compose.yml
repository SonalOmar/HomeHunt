version: "3.9"

services:
  backend:
    build: ./backend
    platform: linux/amd64
    container_name: farm-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: farm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
